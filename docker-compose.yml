# Local demo: the shop, SQL Server and an OpenTelemetry dashboard.
#
#   docker compose up --build
#
#   Shop       http://localhost:8080   (APP_PORT to change it)
#   Dashboard  http://localhost:18888  (traces, metrics and logs from the shop)
#
#   Sign in as customer@shop.local / Customer#12345 (has wallet credit)
#          or admin@shop.local    / Admin#12345    (admin panel at /Admin)
#
# Payments go through a built-in demo gateway, reCAPTCHA is off and emails are written
# to the app log (`docker compose logs app`). The SA password is a throwaway for this
# local demo only; override it with MSSQL_SA_PASSWORD.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Shop_Local_Demo_123}
    volumes:
      - shop-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Database=EshopDatabase;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Shop_Local_Demo_123};TrustServerCertificate=True"
      Database__ApplyMigrations: "true"
      Database__SeedDemoData: "true"
      GoogleRecaptcha__Enabled: "false"
      Payment__Provider: Demo
      ApplicationSettings__DomainLink: "http://localhost:${APP_PORT:-8080}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://dashboard:18889"
      OTEL_SERVICE_NAME: online-shop
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13
    ports:
      - "18888:18888"
    environment:
      # Local demo only: no login on the dashboard UI or the OTLP endpoint.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"

volumes:
  shop-sql:
