name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Online-Shop-Ecommerce.sln

      - name: Build
        run: dotnet build Online-Shop-Ecommerce.sln -c Release --no-restore

      # Unit tests over in-memory SQLite, plus the whole site booted in memory and
      # driven over HTTP for the security and checkout tests.
      - name: Test
        run: dotnet test Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Migrations match the model
        run: |
          dotnet tool restore
          dotnet dotnet-ef migrations has-pending-model-changes --project Infra.Data --startup-project Web --configuration Release --no-build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Tests/TestResults/*.trx

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Start the stack
        run: docker compose up -d --build

      # Ready means SQL Server is up, migrations ran and the demo data is seeded.
      - name: Wait for the shop to report ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health/ready; then echo; exit 0; fi
            sleep 3
          done
          echo "Shop never became ready" >&2
          exit 1

      - name: Storefront and product list render
        run: |
          curl -fsS http://localhost:8080/ -o /dev/null
          curl -fsS http://localhost:8080/ProductList -o /dev/null

      - name: Compose logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
